<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DriveDocs Login</title>
    <link rel="stylesheet" href="drivedocs.css">
</head>
<body>
    <div class="nav">
        <h1>DriveDocs</h1>
        <div class="nav-actions">
            <h3><a href="./index.html">Home</a></h3>
            <h3 class="upgrade-link"><a href="./payment.html">Upgrade</a></h3>
            <h3><a href="./register.html">Register</a></h3>
        </div>
    </div>
    <div class="page-header">
        <h2>Welcome back</h2>
        <p>Sign in to view your fleet documents, upload new records, and stay on top of renewals.</p>
    </div>
    <div class="auth-container">
        <form class="auth-form" id="loginForm">
            <label for="Email">Email</label>
            <input type="email" id="Email" name="Email" required placeholder="Enter your email">

            <label for="password">Password</label>
            <input type="password" id="password" name="password" required placeholder="Enter your password">

            <button class="primary-btn" type="submit">Login</button>
            <p class="form-message" id="loginMessage" role="alert"></p>
            <button class="button-link resend-button" id="resendButton" type="button" hidden>Resend verification code</button>
            <p class="small-text">Don't have an account? <a href="./register.html">Register here</a></p>
        </form>
    </div>

    <script>
        const API_BASE = ['localhost', '127.0.0.1'].includes(window.location.hostname)
            ? 'http://localhost:5000'
            : 'https://drivedocs-backend.onrender.com';
        const loginMessage = document.getElementById('loginMessage');
        const resendButton = document.getElementById('resendButton');
        const emailInput = document.getElementById('Email');

        resendButton.addEventListener('click', async () => {
            if (!emailInput.value.trim()) {
                loginMessage.textContent = 'Enter your email address first.';
                emailInput.focus();
                return;
            }
            resendButton.disabled = true;
            loginMessage.textContent = 'Sending a new verification code...';
            try {
                const response = await fetch(`${API_BASE}/api/user/resend-verification`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ Email: emailInput.value })
                });
                const data = await response.json();
                if (response.ok) {
                    window.location.href = `./verify-email.html?email=${encodeURIComponent(emailInput.value.trim())}`;
                } else {
                    loginMessage.textContent = data.message;
                }
            } catch (error) {
                loginMessage.textContent = 'Could not send the verification code. Please try again.';
            } finally {
                resendButton.disabled = false;
            }
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const Email = document.getElementById('Email').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch(`${API_BASE}/api/user/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ Email, password })
                });

                const data = await res.json();
                if (res.ok) {
                    if (!data.userId) {
                        throw new Error('The server did not return your user ID. Please deploy the latest backend and try again.');
                    }
                    // Store authentication token
                    localStorage.setItem('authToken', data.token || 'authenticated');
                    localStorage.setItem('userId', data.userId);
                    localStorage.setItem('userEmail', Email);
                    localStorage.setItem('plan', data.plan || 'free');
                    localStorage.setItem('vehicleLimit', data.vehicleLimit || '1');
                    localStorage.setItem('trialEndsAt', data.trialEndsAt || '');
                    localStorage.setItem('subscriptionStatus', data.subscriptionStatus || 'active');
                    localStorage.setItem('emailVerified', String(data.emailVerified !== false));
                    localStorage.setItem('accessAllowed', 'true');
                    window.location.href = './dashboard.html';
                } else {
                    loginMessage.textContent = data.message;
                    resendButton.hidden = !data.emailVerificationRequired;
                }
            } catch (err) {
                loginMessage.textContent = err.message || 'Could not connect to the server. Make sure the backend is running on port 5000.';
            }
        });
    </script>
</body>
</html>
