<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose a paid plan | DriveDocs</title>
    <link rel="stylesheet" href="drivedocs.css">
</head>
<body>
    <div class="nav">
        <h1>DriveDocs</h1>
        <div class="nav-actions">
            <h3><a href="./index.html">Home</a></h3>
            <h3><a href="./profile.html">Profile</a></h3>
        </div>
    </div>
    <div class="page-header">
        <h2 id="paymentTitle">Complete your plan upgrade</h2>
        <p id="paymentDescription">Choose a paid plan to expand your fleet workspace.</p>
    </div>
    <main class="payment-page">
        <section class="payment-card">
            <p class="payment-label">Selected plan</p>
            <h3 id="planName">Starter</h3>
            <p id="planPrice">₹499/month</p>
            <button class="primary-btn payment-button" id="payButton" type="button">Pay securely with Razorpay</button>
            <p class="payment-message" id="paymentMessage" role="status" aria-live="polite"></p>
        </section>
    </main>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script>
        const API_BASE = ['localhost', '127.0.0.1'].includes(window.location.hostname)
            ? 'http://localhost:5000'
            : 'https://drivedocs-backend.onrender.com';
        const plans = {
            starter: { name: 'Starter', amount: 49900, price: '₹499/month' },
            business: { name: 'Business', amount: 149900, price: '₹1499/month' }
        };
        const params = new URLSearchParams(window.location.search);
        const plan = plans[params.get('plan')] || plans.starter;
        const email = params.get('email') || localStorage.getItem('userEmail') || '';
        const message = document.getElementById('paymentMessage');
        document.getElementById('planName').textContent = plan.name;
        document.getElementById('planPrice').textContent = plan.price;

        document.getElementById('payButton').addEventListener('click', async () => {
            const button = document.getElementById('payButton');
            button.disabled = true;
            message.textContent = 'Preparing secure checkout...';
            try {
                const configResponse = await fetch(`${API_BASE}/api/payment/config`);
                const config = await configResponse.json();
                if (!configResponse.ok) throw new Error(config.message);
                const orderResponse = await fetch(`${API_BASE}/api/payment/create-order`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ amount: plan.amount })
                });
                const order = await orderResponse.json();
                if (!orderResponse.ok) throw new Error(order.message);
                const checkout = new Razorpay({
                    key: config.keyId,
                    amount: order.amount,
                    currency: order.currency,
                    name: 'DriveDocs',
                    description: `${plan.name} Plan subscription`,
                    order_id: order.order_id,
                    prefill: { email },
                    handler: async (response) => {
                        const verifyResponse = await fetch(`${API_BASE}/api/payment/verify-payment`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(response)
                        });
                        const result = await verifyResponse.json();
                        message.textContent = verifyResponse.ok ? 'Payment verified successfully.' : result.message;
                    },
                    modal: { ondismiss: () => { message.textContent = 'Payment cancelled.'; } },
                    theme: { color: '#0f766e' }
                });
                checkout.on('payment.failed', (response) => {
                    message.textContent = response.error.description || 'Payment failed. Please try again.';
                });
                checkout.open();
            } catch (error) {
                message.textContent = error.message || 'Unable to start payment.';
            } finally {
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
